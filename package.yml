package: bh3gei.lzcapp.modelrouter
version: 0.9.0
name: 模型路由器
description: >-
  给 Claude Code、Codex 等编程 agent 用的模型路由器：一个地址、一把 key 接入你所有的模型套餐。模型组按顺序自动回退（包月套餐优先、按量计费兜底），
  多把上游 key 故障自动切换，每次调用都记账，带用量面板和限额；兼容 Anthropic Messages、OpenAI Chat Completions 与 Responses。
author: BH3GEI
license: MIT
homepage: https://github.com/BH3GEI/api-relay
locales:
  zh:
    name: 模型路由器
    description: >-
      给 Claude Code、Codex 等编程 agent 用的模型路由器：一个地址、一把 key 接入你所有的模型套餐。模型组按顺序自动回退（包月套餐优先、按量计费兜底），
      多把上游 key 故障自动切换，每次调用都记账，带用量面板和限额；兼容 Anthropic Messages、OpenAI Chat Completions 与 Responses。
  en:
    name: Model Router
    description: >-
      A model router for coding agents such as Claude Code and Codex: one endpoint and one key for all your model plans. Model groups
      fall back in order (monthly plans first, pay-as-you-go last), upstream keys fail over automatically, every call is metered with a
      usage dashboard and limits. Speaks Anthropic Messages, OpenAI Chat Completions and Responses.
